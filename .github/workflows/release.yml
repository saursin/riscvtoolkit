# Builds and tests the toolkit; with "publish" checked, publishes it as release
# <TOOLKIT_VERSION>. Run by hand after bumping versions.env.
# Two jobs: "build" uploads the tarball as an artifact, "test" tests and publishes it, so a
# failed test or publish can be re-run ("Re-run failed jobs") without rebuilding.
name: release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the release (otherwise build and test only)
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-22.04     # oldest runner: the binaries run on its glibc (2.35) or newer
    timeout-minutes: 360
    env:
      PREFIX: ${{ github.workspace }}/riscvtoolkit
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake autotools-dev bc bison build-essential \
            curl flex gawk git gperf help2man libexpat-dev libfl-dev libftdi1-dev libgmp-dev \
            libhidapi-dev libmpc-dev libmpfr-dev libtool libusb-1.0-0-dev ninja-build \
            patchutils pkg-config python3-pip texinfo zlib1g-dev
          pip install meson     # picolibc needs a newer meson than 22.04 ships

      - name: GCC, binutils, GDB, newlib
        run: ./build.sh gcc
      - name: picolibc
        run: ./build.sh picolibc
      - name: dtc
        run: ./build.sh dtc
      - name: Spike
        run: ./build.sh spike
      - name: pk
        run: ./build.sh pk
      - name: Verilator
        run: ./build.sh verilator
      - name: OpenOCD
        run: ./build.sh openocd
      - name: Strip, add env files
        run: ./build.sh finish

      - name: Package
        run: |
          source versions.env
          tarball=riscvtoolkit-$TOOLKIT_VERSION-linux-x86_64.tar.xz
          tar -cf - riscvtoolkit | xz -T0 -9 > $tarball
          sha256sum $tarball > $tarball.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: riscvtoolkit
          path: riscvtoolkit-*
          compression-level: 0    # already xz

  test:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: riscvtoolkit

      - name: Runtime libraries (OpenOCD)
        run: |
          sudo apt-get update
          sudo apt-get install -y libftdi1-2 libhidapi-hidraw0 libusb-1.0-0

      - name: Test the tarball, unpacked elsewhere
        run: |
          sha256sum -c riscvtoolkit-*.sha256
          tar -xJf riscvtoolkit-*.tar.xz -C $RUNNER_TEMP
          ./test.sh $RUNNER_TEMP/riscvtoolkit

      - name: Publish release
        if: ${{ inputs.publish && !env.ACT }}     # never in local runs with act
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source versions.env
          { echo 'Built from these pinned sources (`versions.env`):'; echo
            echo '```sh'; cat versions.env; echo '```'; } > notes.md
          gh release create "$TOOLKIT_VERSION" riscvtoolkit-*.tar.xz riscvtoolkit-*.sha256 \
            --title "riscvtoolkit $TOOLKIT_VERSION" --notes-file notes.md
